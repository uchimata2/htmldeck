<body>

<!-- The degraded state (DS-009), and the one thing on this page that ships switched ON.
     `<html data-preflight="pending">` is in the source, so an unsupported browser paints the
     flowed document and never the blank stage; the block below is what takes the marker off.
     A recipient who runs no script at all reads this sentence, which is why it is markup and not
     something the script writes - the case it covers is the case where nothing writes anything. -->
<div class="preflight">
  <p class="preflight-say" id="preflightSay">This deck needs JavaScript to present itself. Every
    slide's content is below instead, in order.</p>
</div>
<script id="preflight">{{PREFLIGHT}}</script>

<!-- icon sprite: only the icons this deck uses, one per concept (DS-113/114) -->
<svg class="sr" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <g id="lucide" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></g>
 </defs>
{{ICONS}}
</svg>

<div class="viewport" id="viewport">
<main class="stage" id="stage" aria-label="Presentation">
{{SLIDES}}
<!-- ============================================================ chrome -->
<nav class="chrome" aria-label="Deck navigation">
  <!-- The ruler (T-035). `data-scale` is not decoration: DS-217 counts a regular repeating scale
       as ONE item rather than n, and the gate verifies the claim - uniform mark, uniform pitch,
       no per-item label at rest - rather than trusting the attribute.
       The label is aria-hidden because every tick carries its own accessible name. The visible
       swap is a sighted-user affordance and must not be announced on every focus move. -->
  <!-- The navigation container (T-114). The ruler, the counter and the pager answer one
       question - where am I, and how do I move - so they share a box and read as one control.
       `Read` and `Motion` answer different questions and sit outside it. That is what the
       complaint about the pager was actually about: it was not under-styled, it was in the
       wrong company. -->
  <div class="navbox">
    <div class="ruler" id="ruler" data-ticks="dot">
      <ul class="ruler-ticks" id="rulerTicks" data-scale></ul>
      <i class="ruler-ring" id="rulerRing" aria-hidden="true"></i>
      <p class="ruler-label" id="rulerLabel" aria-hidden="true"></p>
    </div>
    <p class="count" id="count" aria-hidden="true"></p>
    <button class="btn btn--pager is-back" id="prev" aria-label="Previous slide"><span class="chev l"></span></button>
    <button class="btn btn--pager" id="next" aria-label="Next slide"><span class="chev r"></span></button>
  </div>
  <!-- The chrome row's TAIL, and a SLOT because what sits here varies by deck (T-114 step 7a).
       DS-218 wants a persistent, keyboard-operable stop for motion that loops, and a control
       behind a click is not persistent - so `Motion` sits inside the menu where the deck has
       nothing looping, and as a sibling of `.more` where it does. The slot is the REGION rather
       than the control because `Motion` has no varying content, it has a varying PARENT, and no
       slot bounded to one element can express a move between two parents. `shell.py new` writes
       the menu form, because a fresh deck has no motion yet; `audit.py` decides correctness off
       the built markup, which is why the placement is made at build time and not at run time.

       The anchor below is the slot's opening delimiter and is compared rather than found: a deck
       whose tail has drifted has to fail `shell.py check` rather than be re-anchored around. -->
  <!-- chrome-tail -->
{{CHROME_TAIL}}
</nav>

</main>
</div>

<!-- the conforming alternate version. Carries all content, tier two included (DS-070..076) -->
<article class="doc" id="doc" aria-label="Reading view">
  <div class="doc-inner">
    <header class="doc-head">
      <h1 class="t">{{DOC_TITLE}}</h1>
      <p class="s">{{DOC_SUB}}</p>
    </header>
    <div id="docBody"></div>
  </div>
</article>
<button class="viewswitch" id="toStage">Presentation</button>

<!-- the quick view: one surface, filled from the cited slide's own <template class="qv-src">
     (T-070). Empty in the shell because what it shows is per-deck; present in the shell because
     the surface is not. A source rendered here is a rendering and says so - the note is part of
     the component, not documentation about it. -->
<div class="qv" id="qv" hidden role="dialog" aria-modal="true" aria-labelledby="qvTitle">
  <div class="qv-sheet">
    <header class="qv-head">
      <p class="qv-title" id="qvTitle"></p>
      <!-- the source file, filled by the script from the control's data-file. The title above is
           what the deck calls this source; this is what the reader types to find the original
           outside it. Empty where the source has no file, and empty means no row (T-109). -->
      <p class="qv-file" id="qvFile"></p>
      <p class="qv-note">Quick view — rendered from the source and carried in this deck. Not the
        original file.</p>
      <button class="qv-close" id="qvClose" aria-label="Close the quick view">Close</button>
    </header>
    <div class="qv-body" id="qvBody"></div>
  </div>
</div>

<style id="slides">{{COMPOSITION}}</style>

<script>{{SCRIPT}}</script>
</body>
</html>
